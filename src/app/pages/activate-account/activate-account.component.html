<div class="container">
  <ng-container *ngIf="submitted(); else codeForm">
    <div class="activate-message" *ngIf="isOkay(); else activationError">
      <h2>Activation successful!</h2>
      <p>{{ message() }}</p>
      <button class="btn btn-success" (click)="redirectToLogin()">Go to Login</button>
    </div>
    <ng-template #activationError>
      <div class="activate-error">
        <h2>Activation failed!</h2>
        <p>{{ message() }}</p>
        <button class="btn btn-secondary" (click)="resetForm()">Try again</button>
      </div>
    </ng-template>
  </ng-container>

  <ng-template #codeForm>
    <div class="container-fluid login-container">
      <form [formGroup]="activationForm" (ngSubmit)="onSubmit()">
        <div class="text-center" style="width: 400px;">
          <h2>Type your activation code</h2>
          <div class="form-group">
            <input 
              formControlName="activationCode"
              type="text"
              class="form-control"
              id="activation_code"
              placeholder="Enter activation code"
              (input)="activationForm.updateValueAndValidity()"
              [class.is-invalid]="activationForm.get('activationCode')?.invalid && activationForm.get('activationCode')?.touched"
            >
            <div *ngIf="activationForm.get('activationCode')?.invalid && activationForm.get('activationCode')?.touched" class="invalid-feedback">
              <div *ngIf="activationForm.get('activationCode')?.errors?.['required']">
                Activation code is required
              </div>
              <div *ngIf="activationForm.get('activationCode')?.errors?.['minlength']">
                Activation code must be at least 6 characters long
              </div>
            </div>
          </div>
        </div>
        <hr>
        <div class="d-flex justify-content-end mb-3">
          <button 
            type="submit" 
            class="btn btn-primary" 
            [disabled]="activationForm.invalid || isLoading()"
          >
            <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <em>Activate</em>
          </button>
        </div>
      </form>
    </div>
  </ng-template>
</div>
