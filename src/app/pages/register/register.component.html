<div class="container-fluid card login-container">
    <h3 class="text-center">Create an account</h3>
    <hr>
    @if(errorMsg.length){
        <div class="alert alert-danger" role="alert">
            @for (msg of errorMsg; track msg){
                <p>{{msg}}</p>
            }
        </div>
    }
    <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input [(ngModel)]="registerRequest.email" type="email" class="form-control" id="email" placeholder="name@example.com">
    </div>
    <div class="mb-3">
        <label for="firstname" class="form-label">Firstname</label>
        <input [(ngModel)]="registerRequest.first_name" type="text" class="form-control" id="firstname">
    </div>
    <div class="mb-3">
        <label for="lastname" class="form-label">Lastname</label>
        <input [(ngModel)]="registerRequest.last_name" type="text" class="form-control" id="lastname">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input [(ngModel)]="registerRequest.password" type="password" class="form-control" id="password">
    </div>
    <div class="d-flex justify-content-between mb-3">
        <button (click)="register()" type="button" class="btn btn-primary">
            <em class="fas fa-sign-in-alt">&nbsp;Sign up</em>
        </button>
        <div>
            Already have an account?
            <button (click)="login()" type="button" class="btn btn-link">
                Login
            </button>
        </div>
    </div>
</div>
